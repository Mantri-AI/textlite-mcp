services:
  textlite-mcp:
    build: .
    ports:
      - "127.0.0.1:8000:8000" # Local-only by default; use TLS/auth proxy for public deployment.
    environment:
      MCP_TRANSPORT: http
      TEXTLITE_EMBEDDING_MODEL: sentence-transformers/all-MiniLM-L6-v2
      TEXTLITE_QUERY_MODEL: sentence-transformers/multi-qa-MiniLM-L6-cos-v1
      TEXTLITE_RERANK_MODEL: cross-encoder/ms-marco-MiniLM-L-6-v2
    volumes:
      - model_cache:/home/app/.cache/huggingface
    restart: unless-stopped

volumes:
  model_cache:
