[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "textlite-mcp-server"
version = "0.1.0"
description = "FastMCP tools for TextLite semantic NLP utilities"
readme = "README.md"
requires-python = ">=3.11"
# This project is intended to be installed from source or as a Docker image.
# The direct Git dependency works with pip but must be replaced by a published
# dependency before this project itself can be distributed via PyPI.
dependencies = [
  "fastmcp>=4.0,<5.0",
  "numpy>=1.24,<3",
  "scikit-learn>=1.3,<2",
  "sentence-transformers>=3.0,<6",
  "transformers>=4.40,<5",
  "torch>=2.1,<3",
  "textlite @ git+https://github.com/meru-research/textlite.git@main",
]

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-asyncio>=0.23", "build>=1.2"]

[project.scripts]
textlite-mcp = "textlite_mcp.server:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
